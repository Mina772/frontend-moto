# Web service overlay; combine with ../erp-backend/docker-compose.yml as the first file.
services:
  web:
    build:
      context: ../erp-frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
        VITE_PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in erp-backend/.env.docker}
    image: moto/web:${APP_VERSION:-2.0.0}
    restart: unless-stopped
    depends_on:
      - api
    # Terminate TLS in front of this (nginx/Traefik/Caddy) and forward to 8080.
    ports:
      - "${WEB_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 256m

